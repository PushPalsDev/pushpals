name: Publish Wiki

on:
  push:
    branches: ["main"]
    paths:
      - "docs/wiki/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Checkout wiki repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Sync docs/wiki -> wiki repo
        shell: bash
        run: |
          # Copy docs/wiki contents into the ROOT of the wiki repo
          rsync -av --delete docs/wiki/ wiki/

          # GitHub wiki homepage must be Home.md
          # Keep README.md in your repo, but publish it as Home.md in the wiki.
          if [ -f wiki/README.md ]; then
            cp -f wiki/README.md wiki/Home.md
          fi

      - name: Commit & push wiki
        working-directory: wiki
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Sync wiki from docs/wiki"
          git push