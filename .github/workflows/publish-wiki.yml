name: Publish Wiki

on:
  push:
    branches: ["main"]
    paths:
      - "docs/wiki/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v7

      - name: Checkout wiki repo (master)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          ref: master

      - name: Sync docs/wiki -> wiki repo root
        shell: bash
        run: |
          rsync -av --delete --exclude='.git' docs/wiki/ wiki/
          if [ -f wiki/README.md ]; then
            cp -f wiki/README.md wiki/Home.md
          fi
          test -d wiki/.git

      - name: Commit & push wiki (master)
        working-directory: wiki
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Sync wiki from docs/wiki"
          git push origin HEAD:master
