name: CLI E2E

on:
  pull_request:
    paths:
      - ".github/workflows/cli-e2e.yml"
      - "package.json"
      - "bun.lock"
      - "scripts/pushpals-cli.ts"
      - "packages/cli/**"
      - "packages/protocol/**"
      - "packages/shared/**"
      - "apps/server/**"
      - "apps/localbuddy/**"
      - "apps/remotebuddy/**"
      - "apps/workerpals/**"
      - "apps/source_control_manager/**"
      - "tests/integration/cli.e2e.ts"
      - "tests/integration/workerpals.control-plane.e2e.ts"
  push:
    branches:
      - main
      - main_agents
    paths:
      - ".github/workflows/cli-e2e.yml"
      - "package.json"
      - "bun.lock"
      - "scripts/pushpals-cli.ts"
      - "packages/cli/**"
      - "packages/protocol/**"
      - "packages/shared/**"
      - "apps/server/**"
      - "apps/localbuddy/**"
      - "apps/remotebuddy/**"
      - "apps/workerpals/**"
      - "apps/source_control_manager/**"
      - "tests/integration/cli.e2e.ts"
      - "tests/integration/workerpals.control-plane.e2e.ts"
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

concurrency:
  group: cli-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged_cli_e2e_linux:
    name: Packaged CLI E2E (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Docker engine
        run: docker version

      - name: Run packaged CLI E2E suite
        run: bun run test:cli:e2e

  workerpals_control_plane_e2e_linux:
    name: WorkerPals Control Plane E2E (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Docker engine
        run: docker version

      - name: Run WorkerPals control-plane E2E suite
        run: bun run test:workerpals:e2e

  windows_host_docker_e2e:
    name: Windows Host Docker E2E
    runs-on:
      - self-hosted
      - windows
      - x64
      - docker
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Docker engine
        run: docker version

      - name: Run packaged CLI E2E suite
        run: bun run test:cli:e2e

      - name: Run WorkerPals control-plane E2E suite
        run: bun run test:workerpals:e2e
