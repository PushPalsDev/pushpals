name: CLI E2E

on:
  pull_request:
    paths:
      - ".github/workflows/cli-e2e.yml"
      - "package.json"
      - "bun.lock"
      - "scripts/pushpals-cli.ts"
      - "packages/cli/**"
      - "packages/protocol/**"
      - "packages/shared/**"
      - "apps/server/**"
      - "apps/localbuddy/**"
      - "apps/remotebuddy/**"
      - "apps/workerpals/**"
      - "apps/source_control_manager/**"
      - "tests/integration/cli.e2e.ts"
  push:
    branches:
      - main
      - main_agents
    paths:
      - ".github/workflows/cli-e2e.yml"
      - "package.json"
      - "bun.lock"
      - "scripts/pushpals-cli.ts"
      - "packages/cli/**"
      - "packages/protocol/**"
      - "packages/shared/**"
      - "apps/server/**"
      - "apps/localbuddy/**"
      - "apps/remotebuddy/**"
      - "apps/workerpals/**"
      - "apps/source_control_manager/**"
      - "tests/integration/cli.e2e.ts"
  workflow_dispatch:
    inputs:
      run_windows_smoke:
        description: "Run the optional Windows self-hosted Docker smoke lane"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 10 * * *"

concurrency:
  group: cli-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged_cli_e2e_linux:
    name: Packaged CLI E2E (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Docker engine
        run: docker version

      - name: Run packaged CLI E2E suite
        run: bun run test:cli:e2e

  packaged_cli_e2e_windows:
    name: Packaged CLI E2E (Windows Smoke)
    if: ${{ vars.PUSHPALS_WINDOWS_SMOKE_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_windows_smoke) }}
    runs-on:
      - self-hosted
      - windows
      - x64
      - docker
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Docker engine
        run: docker version

      - name: Run packaged CLI E2E suite
        run: bun run test:cli:e2e
