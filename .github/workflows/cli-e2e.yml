name: CLI E2E

on:
  pull_request:
    paths:
      - ".github/workflows/cli-e2e.yml"
      - "package.json"
      - "bun.lock"
      - "scripts/pushpals-cli.ts"
      - "scripts/cli_clear_remove.ts"
      - "scripts/runtime-launch-trampoline.ts"
      - "scripts/start_runtime_services.ts"
      - "scripts/sync-cli-runtime-assets.ts"
      - "scripts/verify-cli-package-payload.ts"
      - "packages/cli/**"
      - "packages/protocol/**"
      - "packages/shared/**"
      - "prompts/**"
      - "apps/server/**"
      - "apps/localbuddy/**"
      - "apps/remotebuddy/**"
      - "apps/workerpals/**"
      - "apps/source_control_manager/**"
      - "tests/integration/cli.e2e.ts"
      - "tests/cli.bun-runtime-resolver.test.ts"
      - "tests/cli.runtime-bootstrap.test.ts"
      - "tests/cli.shutdown-confirmation.test.ts"
      - "tests/source-control-manager.lock.test.ts"
      - "tests/cli.clear-progress.test.ts"
      - "tests/cli.worker-startup-readiness.test.ts"
      - "tests/remotebuddy.worker-spawn-command.test.ts"
      - "tests/shared.repository-snapshot.test.ts"
      - "tests/release-package-payload.test.ts"
      - "tests/runtime-launch-trampoline.test.ts"
      - "tests/start.runtime-services.test.ts"
      - "tests/workerpals.runtime-paths.test.ts"
      - "tests/integration/workerpals.control-plane.e2e.ts"
      - "tests/workerpals.direct-worktree.test.ts"
      - "tests/workerpals.docker-executor.test.ts"
      - "tests/workerpals.execution-readiness.test.ts"
      - "tests/server.worker-execution-readiness.test.ts"
      - "tests/server.review-quality-metrics.test.ts"
      - "tests/remotebuddy.worker-autoscale.test.ts"
      - "tests/shared.runtime-diagnostics.test.ts"
      - "tests/workerpals.runtime-sandbox-mirror.test.ts"
      - "tests/workerpals.sandbox-env.test.ts"
      - "tests/workerpals.windows-sandbox-env.integration.test.ts"
      - "tests/workerpals.worktree-boundary.test.ts"
      - "tests/fixtures/Dockerfile.worktree-boundary"
  push:
    branches:
      - main
      - main_agents
    paths:
      - ".github/workflows/cli-e2e.yml"
      - "package.json"
      - "bun.lock"
      - "scripts/pushpals-cli.ts"
      - "scripts/cli_clear_remove.ts"
      - "scripts/runtime-launch-trampoline.ts"
      - "scripts/start_runtime_services.ts"
      - "scripts/sync-cli-runtime-assets.ts"
      - "scripts/verify-cli-package-payload.ts"
      - "packages/cli/**"
      - "packages/protocol/**"
      - "packages/shared/**"
      - "prompts/**"
      - "apps/server/**"
      - "apps/localbuddy/**"
      - "apps/remotebuddy/**"
      - "apps/workerpals/**"
      - "apps/source_control_manager/**"
      - "tests/integration/cli.e2e.ts"
      - "tests/cli.bun-runtime-resolver.test.ts"
      - "tests/cli.runtime-bootstrap.test.ts"
      - "tests/cli.shutdown-confirmation.test.ts"
      - "tests/source-control-manager.lock.test.ts"
      - "tests/cli.clear-progress.test.ts"
      - "tests/cli.worker-startup-readiness.test.ts"
      - "tests/remotebuddy.worker-spawn-command.test.ts"
      - "tests/shared.repository-snapshot.test.ts"
      - "tests/release-package-payload.test.ts"
      - "tests/runtime-launch-trampoline.test.ts"
      - "tests/start.runtime-services.test.ts"
      - "tests/workerpals.runtime-paths.test.ts"
      - "tests/integration/workerpals.control-plane.e2e.ts"
      - "tests/workerpals.direct-worktree.test.ts"
      - "tests/workerpals.docker-executor.test.ts"
      - "tests/workerpals.execution-readiness.test.ts"
      - "tests/server.worker-execution-readiness.test.ts"
      - "tests/server.review-quality-metrics.test.ts"
      - "tests/remotebuddy.worker-autoscale.test.ts"
      - "tests/shared.runtime-diagnostics.test.ts"
      - "tests/workerpals.runtime-sandbox-mirror.test.ts"
      - "tests/workerpals.sandbox-env.test.ts"
      - "tests/workerpals.windows-sandbox-env.integration.test.ts"
      - "tests/workerpals.worktree-boundary.test.ts"
      - "tests/fixtures/Dockerfile.worktree-boundary"
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

concurrency:
  group: cli-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release_preflight_linux:
    name: Release Preflight (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build complete CLI package
        run: bun run cli:bundle

      - name: Capture tracked generated runtime changes
        run: git diff --binary -- packages/cli/runtime > "$RUNNER_TEMP/runtime-assets.patch"

      - name: Upload generated runtime changes for this commit
        uses: actions/upload-artifact@v7
        with:
          name: runtime-assets-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-assets.patch
          retention-days: 7
          if-no-files-found: error

      - name: Verify package payload
        run: bun run cli:verify-package-payload

      - name: Typecheck worker and publication services
        run: |
          node node_modules/typescript/bin/tsc --noEmit -p apps/workerpals/tsconfig.json
          node node_modules/typescript/bin/tsc --noEmit -p apps/source_control_manager/tsconfig.json

      - name: Run full root suite including native SQLite lock recovery
        run: bun run test:root

      - name: Verify diff whitespace
        run: git diff --check

  windows_worker_path_contract:
    name: Windows Worker Path Contract
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Windows Bun runtime resolution
        run: |
          bun test tests/cli.bun-runtime-resolver.test.ts
          bun test tests/cli.runtime-bootstrap.test.ts --test-name-pattern "npm package shim"

      - name: Verify worker startup readiness
        run: bun test tests/cli.worker-startup-readiness.test.ts

      - name: Verify health recovery reporting
        run: bun test tests/start.runtime-services.test.ts tests/cli.runtime-bootstrap.test.ts tests/cli.shutdown-confirmation.test.ts tests/cli.clear-progress.test.ts

      - name: Verify execution capability and review quality contracts
        run: >-
          bun test
          tests/workerpals.execution-readiness.test.ts
          tests/server.worker-execution-readiness.test.ts
          tests/server.review-quality-metrics.test.ts
          tests/remotebuddy.worker-autoscale.test.ts
          tests/shared.runtime-diagnostics.test.ts

      - name: Verify compact worktree, sandbox, and packaged-runtime paths
        run: >-
          bun test
          tests/shared.repository-snapshot.test.ts
          tests/workerpals.direct-worktree.test.ts
          tests/workerpals.sandbox-env.test.ts
          tests/workerpals.runtime-sandbox-mirror.test.ts
          tests/workerpals.windows-sandbox-env.integration.test.ts
          tests/workerpals.worktree-boundary.test.ts

      - name: Verify Windows worker recovery and trusted-validation contracts
        run: >-
          bun test
          tests/workerpals.executor-timeout-recovery.test.ts
          tests/source-control-manager.trusted-validation.test.ts
          tests/source-control-manager.lock.test.ts
          tests/source-control-manager.http.test.ts
          tests/source-control-manager.runtime-helpers.test.ts
          tests/source-control-manager.review-agent.test.ts
          tests/source-control-manager.review-journal.test.ts
          tests/source-control-manager.review-publication.test.ts
          tests/source-control-manager.review-publication-recovery.test.ts
          tests/shared.review-publication-validation.test.ts
          tests/source-control-manager.github-pr.test.ts

      - name: Verify isolated Windows source-only runtime startup
        env:
          PUSHPALS_KEEP_E2E_TMP: "1"
        run: >-
          bun test
          --test-name-pattern "boots (packaged Windows runtime|every Windows service)"
          ./tests/integration/cli.e2e.ts

      - name: Upload Windows source-only startup logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-source-only-startup-logs
          path: ${{ runner.temp }}/pushpals-cli-e2e-*/runtime/logs/**
          if-no-files-found: warn
          retention-days: 7

  packaged_cli_e2e_linux:
    name: Packaged CLI E2E (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release package payload contract
        run: bun test tests/release-package-payload.test.ts

      - name: Verify repository snapshot boundaries
        run: bun test tests/shared.repository-snapshot.test.ts

      - name: Verify worker startup readiness
        run: bun test tests/cli.worker-startup-readiness.test.ts

      - name: Verify health recovery reporting
        run: bun test tests/start.runtime-services.test.ts tests/cli.runtime-bootstrap.test.ts tests/cli.shutdown-confirmation.test.ts tests/cli.clear-progress.test.ts

      - name: Verify Docker engine
        run: docker version

      - name: Run packaged CLI E2E suite
        run: bun run test:cli:e2e

  workerpals_control_plane_e2e_linux:
    name: WorkerPals Control Plane E2E (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Docker engine
        run: docker version

      - name: Verify Linux dependency projection contract
        env:
          PUSHPALS_RUN_DEPENDENCY_PROJECTION_INTEGRATION: "1"
        run: bun test tests/workerpals.docker-executor.test.ts

      - name: Run WorkerPals control-plane E2E suite
        run: bun run test:workerpals:e2e

  windows_host_docker_e2e:
    name: Windows Host Docker E2E
    if: github.event_name == 'workflow_dispatch'
    needs:
      - packaged_cli_e2e_linux
      - workerpals_control_plane_e2e_linux
      - windows_worker_path_contract
    runs-on:
      - self-hosted
      - windows
      - x64
      - docker
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Docker engine
        run: docker version

      - name: Build worktree boundary image
        run: docker build -t pushpals-worktree-boundary:test -f tests/fixtures/Dockerfile.worktree-boundary tests/fixtures

      - name: Validate Windows-host Linux-container worktree boundary
        shell: pwsh
        env:
          PUSHPALS_WINDOWS_LINUX_WORKTREE_E2E: "1"
          PUSHPALS_WORKTREE_BOUNDARY_IMAGE: pushpals-worktree-boundary:test
        run: bun test tests/workerpals.worktree-boundary.test.ts

      - name: Run packaged CLI E2E suite
        run: bun run test:cli:e2e

      - name: Run WorkerPals control-plane E2E suite
        run: bun run test:workerpals:e2e
