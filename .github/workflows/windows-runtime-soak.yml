name: Windows Runtime Soak

on:
  workflow_dispatch:
    inputs:
      duration_ms:
        description: Soak duration in milliseconds
        required: false
        default: "7200000"
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

jobs:
  soak:
    name: Bun 1.3.14 embedded runtime soak
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build protocol workspace artifacts
        run: bun run protocol:build

      - name: Build Windows runtime binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/runtime-windows-x64 | Out-Null
          bun build apps/server/src/server_main.ts --compile --target=bun-windows-x64 --outfile dist/runtime-windows-x64/pushpals-runtime-server-windows-x64.exe
          bun build apps/remotebuddy/src/remotebuddy_main.ts --compile --target=bun-windows-x64 --outfile dist/runtime-windows-x64/pushpals-runtime-remotebuddy-windows-x64.exe
          bun build apps/workerpals/src/workerpals_main.ts --compile --target=bun-windows-x64 --outfile dist/runtime-windows-x64/pushpals-runtime-workerpals-windows-x64.exe

      - name: Run autonomy-enabled Windows soak
        shell: pwsh
        env:
          SOAK_DURATION_MS: ${{ inputs.duration_ms || '7200000' }}
        run: |
          bun run scripts/release-windows-runtime-smoke.ts `
            --runtime-bin-dir dist/runtime-windows-x64 `
            --prompts-root . `
            --duration-ms $env:SOAK_DURATION_MS `
            --probe-interval-ms 30000
